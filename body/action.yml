name: Body
description: Write the badge block into the open PR body, or the main block into README.md on main

inputs:
  badges:
    description: one line per badge, label=linkfile, linkfile defaults to badge.json
    required: true
  target:
    description: pr writes the open PR body, readme writes README.md on main
    required: false
    default: pr
  run-id:
    description: run id in the badge url, busts the camo cache, pr only
    required: false
    default: ''
  only-missing:
    description: pr only, skip when the block is already in the body
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Write badge block
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        BADGES: ${{ inputs.badges }}
        TARGET: ${{ inputs.target }}
        RUN_ID: ${{ inputs.run-id }}
        ONLY_MISSING: ${{ inputs.only-missing }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: ruby "$ACTION_PATH/../lib/body.rb"

    - name: Commit README
      if: inputs.target == 'readme'
      shell: bash
      run: |
        git diff --quiet -- README.md && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -qm "Add badges [skip ci]"
        git push -q origin HEAD:main
