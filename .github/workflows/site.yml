name: Site

on:
  workflow_call:
    inputs:
      branch:
        description: store branch for the badge json and files
        type: string
        default: badges

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Switch to store branch
        working-directory: site
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch -q origin "$BRANCH"
            git switch -q -C "$BRANCH" FETCH_HEAD
          else
            git switch -q --orphan "$BRANCH"
            git rm -rq --cached --ignore-unmatch .
            git clean -fdxq
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          merge-multiple: true
          path: ${{ runner.temp }}/badges

      - name: Copy badges from this run
        run: |
          test -s "$RUNNER_TEMP/badges/badge.json" || { echo "no badge.json from this run"; exit 1; }
          cp -R "$RUNNER_TEMP/badges/." site/

      - name: Commit and push badges
        working-directory: site
        env:
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -qm "Update badges from run $RUN_ID"
            git push -q origin HEAD:"$BRANCH"
          fi

      - name: Stage Pages files
        run: rsync -a --exclude .git site/ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
