name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rubocop && ruby -Ilib -e 'Dir["test/*_test.rb"].each { |f| require "./#{f}" }'

  prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prefix
        uses: ./prefix

      - name: Assert prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              expected="$PR_NUMBER/"
              ;;
            *)
              if [ "$BRANCH" = main ]; then
                expected=""
              else
                number=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
                expected="${number:-${BRANCH//\//-}}/"
              fi
              ;;
          esac
          if [ "$PREFIX" != "$expected" ]; then
            echo "prefix [$PREFIX] expected [$expected]"
            exit 1
          fi

  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: cukes
        uses: ./cukes
        with:
          json: test/fixtures/cucumber.json

      - name: Assert cukes
        env:
          MESSAGE: ${{ steps.cukes.outputs.message }}
          COLOR: ${{ steps.cukes.outputs.color }}
        run: |
          [ "$MESSAGE" = "3/3" ] && [ "$COLOR" = brightgreen ]

      - uses: ./make
        with:
          label: cukes
          message: ${{ steps.cukes.outputs.message }}
          color: ${{ steps.cukes.outputs.color }}
          logo: cucumber
          files: test/fixtures/cucumber.json

      - name: Assert json file
        run: |
          expected='{"schemaVersion":1,"label":"cukes","message":"3/3","color":"brightgreen","namedLogo":"cucumber"}'
          [ "$(cat site/cukes.json)" = "$expected" ]
          [ -f site/cucumber.json ]

      - uses: actions/download-artifact@v4
        with:
          name: badge-cukes
          path: downloaded

      - name: Assert artifact
        run: diff -r site downloaded
