name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rubocop && ruby -Ilib -e 'Dir["test/*_test.rb"].each { |f| require "./#{f}" }'

  prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: main_push
        uses: ./prefix
        with:
          branch: main
          event: push

      - name: Assert main push
        env:
          PREFIX: ${{ steps.main_push.outputs.prefix }}
        run: '[ "$PREFIX" = "" ]'

      - id: pr_seven
        uses: ./prefix
        with:
          branch: main
          event: pull_request
          pr: 7

      - name: Assert pull request
        env:
          PREFIX: ${{ steps.pr_seven.outputs.prefix }}
        run: '[ "$PREFIX" = "7/" ]'

      - id: no_pr
        uses: ./prefix
        with:
          branch: no-such/branch
          event: push

      - name: Assert branch without PR
        env:
          PREFIX: ${{ steps.no_pr.outputs.prefix }}
        run: '[ "$PREFIX" = "no-such-branch/" ]'

      - uses: ./prefix

  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: cukes
        uses: ./cukes
        with:
          json: test/fixtures/cucumber.json

      - name: Assert cukes
        env:
          MESSAGE: ${{ steps.cukes.outputs.message }}
          COLOR: ${{ steps.cukes.outputs.color }}
        run: |
          [ "$MESSAGE" = "3/3" ] && [ "$COLOR" = brightgreen ]

      - uses: ./make
        with:
          label: cukes
          message: ${{ steps.cukes.outputs.message }}
          color: ${{ steps.cukes.outputs.color }}
          logo: cucumber
          files: test/fixtures/cucumber.json

      - name: Assert json file
        run: |
          expected='{"schemaVersion":1,"label":"cukes","message":"3/3","color":"brightgreen","namedLogo":"cucumber"}'
          [ "$(cat site/cukes.json)" = "$expected" ]
          [ -f site/cucumber.json ]

      - uses: actions/download-artifact@v4
        with:
          name: badge-cukes
          path: downloaded

      - name: Assert artifact
        run: diff -r site downloaded
