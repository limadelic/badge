name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rubocop && ruby -Ilib -e 'Dir["test/*_test.rb"].each { |f| require "./#{f}" }'

  prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prefix
        uses: ./prefix

      - run: echo "prefix=[${{ steps.prefix.outputs.prefix }}]"
