name: Check

on:
  workflow_call:
    inputs:
      branch:
        description: store branch for the badge json and files
        type: string
        default: badges
      labels:
        description: one line per badge, label=linkfile
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: badge

      - name: Check badges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ inputs.labels }}
          STORE: ${{ inputs.branch }}
        run: ruby badge/lib/check.rb
