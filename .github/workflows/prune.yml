name: Prune

on:
  workflow_call:
    inputs:
      branch:
        description: store branch for the badge json and files
        type: string
        default: badges

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Switch to store branch
        id: store
        working-directory: site
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch -q origin "$BRANCH"
            git switch -q -C "$BRANCH" FETCH_HEAD
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: limadelic/badge
          ref: ${{ job.workflow_sha }}
          path: badge

      - name: List prefixes to drop
        if: steps.store.outputs.exists == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
        run: ruby badge/lib/prefix.rb prune > "$RUNNER_TEMP/prefixes"

      - name: Remove prefixes
        if: steps.store.outputs.exists == 'true'
        working-directory: site
        run: |
          while IFS= read -r prefix; do
            git rm -r -q --ignore-unmatch -- "${prefix%/}"
          done < "$RUNNER_TEMP/prefixes"

      - name: Commit and push pruned badges
        if: steps.store.outputs.exists == 'true'
        working-directory: site
        env:
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -qm "Prune badges from run $RUN_ID"
            git push -q origin HEAD:"$BRANCH"
          fi

      - name: Strip badge block from PR body
        if: github.event_name == 'pull_request'
        working-directory: badge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET: strip
        run: ruby lib/body.rb

      - name: Stage Pages files
        if: steps.store.outputs.exists == 'true'
        run: rsync -a --exclude .git site/ _site/

      - name: Setup Pages
        if: steps.store.outputs.exists == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.store.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        if: steps.store.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
