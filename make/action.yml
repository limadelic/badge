name: Make
description: Write the badge json and files to one dir per label under the prefix in badge-<label>/site, upload that

inputs:
  label:
    description: badge label, names the dir and the artifact
    required: true
  message:
    description: badge message
    required: true
  color:
    description: badge color
    required: true
  logo:
    description: shields named logo
    required: false
    default: ''
  files:
    description: paths to copy into the label dir, space separated; a dir is copied recursively under its own name
    required: false
    default: ''
  link:
    description: what the badge links to; a file in the label dir (top level or a path into a copied dir, e.g. cover/index.html), or a full http(s) URL kept as given; default first plain file of files else badge.json
    required: false
    default: ''

outputs:
  dir:
    description: the dir written, badge-<label>/site/<prefix><label>/
    value: ${{ steps.write.outputs.dir }}
  path:
    description: the label dir relative to the Pages root, <prefix><label>/
    value: ${{ steps.write.outputs.path }}
  link:
    description: the link relative to the Pages root, <prefix><label>/<link>, or the URL as given
    value: ${{ steps.write.outputs.link }}

runs:
  using: composite
  steps:
    - id: write
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        LABEL: ${{ inputs.label }}
        MESSAGE: ${{ inputs.message }}
        COLOR: ${{ inputs.color }}
        LOGO: ${{ inputs.logo }}
        FILES: ${{ inputs.files }}
        LINK: ${{ inputs.link }}
      run: ruby "$ACTION_PATH/../lib/make.rb" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: badge-${{ inputs.label }}
        path: badge-${{ inputs.label }}/site
